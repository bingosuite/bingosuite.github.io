name: Deploy docs

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [bingo-docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site config
        uses: actions/checkout@v4

      - name: Checkout bingo docs
        uses: actions/checkout@v4
        with:
          repository: bingosuite/bingo
          path: bingo-src
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: false

      - name: Stage docs content
        run: |
          mkdir -p docs
          cp -r bingo-src/docs/. docs/
          mkdir -p docs/assets
          cp assets/logo.jpeg docs/assets/logo.jpeg
          find docs -name '*.md' -print0 | xargs -0 sed -i -E \
            's@\]\(\.\./([^)]+)\)@](https://github.com/bingosuite/bingo/blob/main/\1)@g'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
