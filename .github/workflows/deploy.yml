name: Deploy site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [bingo-docs-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing page
        uses: actions/checkout@v4

      - name: Checkout bingo docs
        uses: actions/checkout@v4
        with:
          repository: bingosuite/bingo
          path: bingo-src
          sparse-checkout: |
            docs
          sparse-checkout-cone-mode: false

      - name: Stage docs content
        run: |
          mkdir -p docs-src
          cp -r bingo-src/docs/. docs-src/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install landing page deps
        run: npm ci

      - name: Build landing page
        run: npm run build -- --outDir dist --emptyOutDir false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4